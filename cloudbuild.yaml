# Cloud Build: image → Artifact Registry → Cloud Run (MECE frontend, 2026-10-08).
# Guide and one-time setup: docs/cloud-run.md. Vercel ignores this file.
#
# The production settings come from ONE Secret Manager secret holding a JSON
# object (scripts/cloudrun/env-json.cjs). The build reads it through a BuildKit
# secret mount; the service gets it as a file at /secrets/frontend-env.json.
# Nothing secret is passed as a build arg, env var or substitution.

substitutions:
  _REGION: asia-south1          # Mumbai (Tier 1 pricing; Vercel ran in bom1)
  _SERVICE: mece-web
  _REPO: mece                   # Artifact Registry repository
  _ENV_SECRET: mece-frontend-env
  _RUN_SA: mece-web-run         # runtime service account (reads the secret only)
  _MAX_INSTANCES: '1'           # one instance: one ISR cache, and a hard cost cap

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_ENV_SECRET}/versions/latest
      env: FRONTEND_ENV

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ['FRONTEND_ENV']
    env: ['DOCKER_BUILDKIT=1']
    args:
      - -c
      - |
        set -euo pipefail
        umask 077
        # Outside the build context, so it can never be COPY'd into the image.
        printf '%s' "$$FRONTEND_ENV" > /builder/home/frontend-env.json
        docker build \
          --secret id=frontend_env,src=/builder/home/frontend-env.json \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID \
          .
        rm -f /builder/home/frontend-env.json

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUN_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-secrets=/secrets/frontend-env.json=${_ENV_SECRET}:latest
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --concurrency=80
      - --min-instances=0
      - --max-instances=${_MAX_INSTANCES}
      - --cpu-boost
      - --timeout=300
      - --quiet
