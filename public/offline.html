<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · MECE</title>
<style>
  :root { color-scheme: dark; }
  html,body { height:100%; margin:0; }
  body {
    background:#0F1C33; color:#fff;
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:24px;
  }
  .wrap { max-width:420px; }
  svg { width:88px; height:88px; margin-bottom:20px; }
  h1 { font-size:22px; font-weight:800; margin:0 0 10px; letter-spacing:.2px; }
  p { font-size:15px; line-height:1.55; color:#c7cfdb; margin:0 0 22px; }
  button {
    background:#C8102E; color:#fff; border:0; border-radius:9999px;
    font-size:15px; font-weight:700; padding:12px 26px; cursor:pointer;
  }
  button:active { transform:scale(.98); }
</style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" rx="96" fill="#0F1C33"/>
      <polygon points="104,352 205,220 306,352" fill="#fff"/>
      <polygon points="206,352 306,168 406,352" fill="#C8102E"/>
    </svg>
    <h1>You're offline</h1>
    <p>MECE can't reach the network right now. Check your connection and try again — your saved progress is safe.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
