<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light only"/><meta name="supported-color-schemes" content="light"/><title>Your MECE verification code</title></head>
<body style="margin:0;padding:0;background:#FAF9F6;-webkit-text-size-adjust:100%;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAF9F6;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #E7E3DC;border-radius:14px;overflow:hidden;">
      <tr><td style="background:#0F1C33;padding:18px 28px;">
        <img src="https://www.mece.in/signature/hdr-logo.png" height="30" alt="MECE" style="height:30px;display:block;border:0;outline:none;text-decoration:none;"/>
      </td></tr>
      <tr><td style="height:3px;background:#C8102E;line-height:3px;font-size:0;">&nbsp;</td></tr>
      <tr><td style="padding:32px 28px;font-family:Inter,Helvetica,Arial,sans-serif;color:#1A2233;">
        <h1 style="margin:0 0 8px;font-size:21px;line-height:1.3;color:#0F1C33;font-weight:700;">Your verification code</h1>
        <div style="font-size:15px;line-height:1.6;color:#1A2233;"><p style="margin:0 0 14px;">Enter this code to confirm it is you:</p><p style="margin:0;font-size:28px;font-weight:700;letter-spacing:6px;color:#0F1C33;">{{ .Token }}</p></div>
        
        <p style="margin:22px 0 0;font-size:13px;color:#5B6472;line-height:1.55;">If you didn't ask for this code, you can ignore this email.</p>
      </td></tr>
      <tr><td style="padding:24px 28px 8px;background:#FAF9F6;border-top:1px solid #E7E3DC;font-family:Inter,Helvetica,Arial,sans-serif;">
        <img src="https://www.mece.in/signature/sig-logo.png" width="128" alt="MECE" style="width:128px;max-width:60%;display:block;border:0;outline:none;text-decoration:none;"/>
        <div style="margin:12px 0 2px;font-size:14px;font-weight:700;color:#0F1C33;">Team MECE</div>
      </td></tr>
      <tr><td style="padding:12px 28px 22px;background:#FAF9F6;font-family:Inter,Helvetica,Arial,sans-serif;font-size:12px;color:#5B6472;line-height:1.6;">
        <a href="https://www.mece.in" style="color:#5B6472;text-decoration:underline;">mece.in</a>
      </td></tr>
    </table>
  </td></tr>
</table>
